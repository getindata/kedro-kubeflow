[tox]
envlist = py39, py310, py311, py311-pydantic2, py312

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312

[testenv]
setenv =
  PYTHONPATH = /home/adobrogo/projects/kedro/kedro-kubeflow
allowlist_externals =
    poetry
skip_install = true
commands=
    poetry install -v
    poetry run python -m pytest --cov kedro_kubeflow --cov-report xml --cov-report term-missing --ignore=venv --verbose tests

# kfp 1.8 pins pydantic<2, so the default envs never run Pydantic 2; this one installs it on top.
# No coverage report here, so coverage.xml stays the one from py311.
[testenv:py311-pydantic2]
commands=
    poetry install -v
    poetry run pip install "pydantic>=2,<3"
    poetry run python -m pytest --ignore=venv --verbose tests

# Lint
[flake8]
exclude = .git,__pycache__,docs/source/conf.py,old,build,dist
max-line-length = 121

[mypy]
no_strict_optional = True
ignore_missing_imports = True

[tool:isort]
include_trailing_comma = True
multi_line_output = 3
line_length = 121
known_first_party = kedro_kubeflow
default_section = THIRDPARTY

# Autoformatter
[testenv:black]
basepython = python3
skip_install = true
deps =
    black
commands =
    black

# Release tooling
[testenv:build]
whitelist_externals = poetry
skip_install = true
commands =
    poetry build
